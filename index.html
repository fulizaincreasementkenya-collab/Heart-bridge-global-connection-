/* ============================================================
   PROFILE VALIDATION SYSTEM
   ============================================================ */

function validateProfiles(profileList) {

  const errors = [];

  const ids = new Set();
  const names = new Set();
  const images = new Set();

  profileList.forEach((profile, index) => {

    const position = index + 1;

    /* -------------------------------
       Required fields
    -------------------------------- */

    const requiredFields = [
      "profile_id",
      "name",
      "gender",
      "age",
      "location",
      "bio",
      "interests",
      "relationship_goal",
      "image_url"
    ];

    requiredFields.forEach(field => {

      if (
        profile[field] === undefined ||
        profile[field] === null ||
        profile[field] === ""
      ) {

        errors.push(
          `Profile ${position}: Missing ${field}`
        );

      }

    });


    /* -------------------------------
       Profile ID duplicate check
    -------------------------------- */

    if (ids.has(profile.profile_id)) {

      errors.push(
        `Duplicate profile ID: ${profile.profile_id}`
      );

    }

    ids.add(profile.profile_id);


    /* -------------------------------
       Name duplicate check
    -------------------------------- */

    const normalizedName =
      profile.name.trim().toLowerCase();

    if (names.has(normalizedName)) {

      errors.push(
        `Duplicate profile name: ${profile.name}`
      );

    }

    names.add(normalizedName);


    /* -------------------------------
       Image duplicate check
    -------------------------------- */

    if (images.has(profile.image_url)) {

      errors.push(
        `Duplicate image URL: ${profile.image_url}`
      );

    }

    images.add(profile.image_url);


    /* -------------------------------
       Adult age check
    -------------------------------- */

    if (
      typeof profile.age !== "number" ||
      profile.age < 18
    ) {

      errors.push(
        `${profile.name}: Profile must be an adult aged 18+`
      );

    }


    /* -------------------------------
       Gender validation
    -------------------------------- */

    const allowedGenders = [
      "Male",
      "Female"
    ];

    if (!allowedGenders.includes(profile.gender)) {

      errors.push(
        `${profile.name}: Invalid gender`
      );

    }


    /* -------------------------------
       Bio validation
    -------------------------------- */

    if (
      typeof profile.bio !== "string" ||
      profile.bio.length < 20
    ) {

      errors.push(
        `${profile.name}: Bio is too short`
      );

    }


    /* -------------------------------
       Interests validation
    -------------------------------- */

    if (
      !Array.isArray(profile.interests) ||
      profile.interests.length === 0
    ) {

      errors.push(
        `${profile.name}: Missing interests`
      );

    }

  });


  return {
    valid: errors.length === 0,
    errors
  };

}


/* ============================================================

    </div>

  `;

  return card;
}

/* ============================================================
   SAFE TEXT HANDLING
   ============================================================ */

function escapeHTML(value) {

  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");
}


/* ============================================================
   PROFILE SEARCH / FILTER
   ============================================================ */

function filterProfiles({

  search = "",
  gender = "",
  country = "",
  minAge = 18,
  maxAge = 100

} = {}) {

  const searchText =
    search.trim().toLowerCase();


  return profiles.filter(profile => {

    const matchesSearch =

      !searchText ||

      profile.name
        .toLowerCase()
        .includes(searchText) ||

      profile.location
        .toLowerCase()
        .includes(searchText) ||

      profile.bio
        .toLowerCase()
        .includes(searchText) ||

      profile.interests.some(
        interest =>
          interest
            .toLowerCase()
            .includes(searchText)
      );


    const matchesGender =

      !gender ||
      profile.gender === gender;


    const matchesCountry =

      !country ||
      profile.country === country;


    const matchesAge =

      profile.age >= minAge &&
      profile.age <= maxAge;


    return (

      matchesSearch &&
      matchesGender &&
      matchesCountry &&
      matchesAge

    );

  });

}

      console.error(

        profile.image_url,
        "used by:",

        "and",
        profile.profile_id
      );

    } else {

      imageMap.set(
        profile.image_url,
        profile.profile_id
      );

    }

  });

}
